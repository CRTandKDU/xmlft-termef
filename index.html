<!DOCTYPE html>
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>jQuery/XML on FranceTerme repository</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0-rc.1/jquery.min.js" integrity="sha512-MXe5EK5gyK+fbhwQy/dukwz9fw71HZcsM4KsyDBDTvMyjymkiO0M5qqU0lF4vqLI4VnKf1+DIKf1GM6RFkO8PA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="xmlft.js"></script>
    <style>
     label {
	 display: block;
	 font:
	     1rem "Fira Sans",
	     sans-serif;
     }
     
     input,
     label {
	 margin: 0.4rem 0;
     }

     .styled {
	 border: 0;
	 line-height: 1.5;
	 padding: 0 20px;
	 font-size: 1rem;
	 text-align: center;
	 color: white;
	 text-shadow: 1px 1px 1px black;
	 border-radius: 10px;
	 background-color: tomato;
	 background-image: linear-gradient(
	     to top left,
	     rgb(0 0 0 / 0.2),
	     rgb(0 0 0 / 0.2) 30%,
	     transparent
	 );
	 box-shadow:
	     inset 2px 2px 3px rgb(255 255 255 / 0.6),
	     inset -2px -2px 3px rgb(0 0 0 / 0.6);
     }

     .styled:hover {
	 background-color: red;
     }

     .styled:active {
	 box-shadow:
	     inset -2px -2px 3px rgb(255 255 255 / 0.6),
	     inset 2px 2px 3px rgb(0 0 0 / 0.6);
     }
    </style>
  </head>
  <body>
      <label for="xmlftQuery">Query:</label>
      <input type="text" id="xmlftQuery" name="xmlftQuery"/>
      <button id="suggestions" class="query styled" type="button">Suggestions</button>
      <label for="xmlftResult">Result:</label>
      <textarea  rows="5" cols="64" id="xmlftResult" name="xmlftResult"></textarea>
  </body>
</html>
